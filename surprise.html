<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مفاجأة إلكِ 🎀</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffe9f1;--card:#fff;--pink:#d6336c;--soft:#ffc2d6;--ink:#8a1f4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#ffe9f1;--card:#fff;--pink:#d6336c;--soft:#ffc2d6;--ink:#8a1f4a}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);font-family:'Cairo',system-ui,sans-serif;color:var(--ink);text-align:center;display:flex;justify-content:center}
.wrap{width:100%;max-width:420px;padding:28px 20px 40px;border-top:2px dashed var(--soft);border-bottom:2px dashed var(--soft);margin:18px 0}
.screen{display:none;animation:in .4s}.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
h1{font-size:26px;margin:10px 0 4px;color:var(--pink);font-weight:900}
p.sub{margin:0 0 18px;opacity:.8}
.pin{display:flex;gap:10px;justify-content:center;direction:ltr;margin:14px 0}
.pin input{width:54px;height:60px;border:2px solid var(--soft);border-radius:14px;font-size:26px;text-align:center;color:var(--pink);background:#fff;font-family:inherit;outline:none}
.pin input:focus{border-color:var(--pink);box-shadow:0 0 0 4px #ffd3e2}
.card{background:var(--card);border:2px solid var(--soft);border-radius:20px;padding:16px;margin:16px 0}
button{font-family:inherit;cursor:pointer}
.btn{background:#fff;border:2px solid var(--pink);color:var(--pink);border-radius:30px;padding:10px 30px;font-weight:700;font-size:16px}
.btn:active{background:var(--pink);color:#fff}
.opt{display:block;width:100%;margin:10px 0;padding:14px;border-radius:18px;border:2px solid var(--soft);background:#fff;font-size:18px;font-weight:700;color:var(--ink);transition:.2s}
.opt:active,.opt.sel{background:var(--pink);color:#fff;border-color:var(--pink);transform:scale(.98)}
.dots{font-size:13px;opacity:.7;margin-bottom:6px}
textarea,input.txt{width:100%;border:2px solid var(--soft);border-radius:16px;padding:12px;font-family:inherit;font-size:17px;color:var(--ink);outline:none;background:#fff;margin:10px 0}
textarea{min-height:100px;resize:none}
textarea:focus,input.txt:focus{border-color:var(--pink)}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.sum{text-align:right;line-height:2;font-weight:700}
.heart{position:fixed;top:-30px;font-size:20px;animation:fall 5s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg);opacity:.6}}
.rbtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;background:#fff;border:2px solid var(--pink);color:var(--pink);border-radius:20px;padding:6px 14px;font-weight:700;font-size:14px}
.ov{position:fixed;inset:0;z-index:30;background:rgba(255,233,241,.97);display:none;align-items:center;justify-content:center;padding:20px}
.ov.on{display:flex}
.ovin{width:100%;max-width:380px;text-align:center;position:relative}
.x{position:absolute;top:-6px;left:0;background:none;border:none;font-size:26px;color:var(--pink)}
</style>
</head>
<body>
<button class="rbtn" id="rb">📊 نتائج</button>
<div class="ov" id="ov"><div class="ovin">
  <button class="x" id="xx">✕</button>
  <div id="rlock">
    <div style="font-size:34px">🔐</div>
    <h1>النتائج</h1>
    <p class="sub">اكتب الكود</p>
    <input class="txt" id="rc" dir="ltr" style="text-align:center;letter-spacing:4px" placeholder="••••" autocapitalize="characters" autocomplete="off">
    <button class="btn" id="rgo">فتح ♡</button>
    <p class="sub" id="rerr" style="margin-top:12px"></p>
  </div>
  <div id="rres" style="display:none">
    <h1>📊 النتائج</h1>
    <div class="card sum" id="rbody"></div>
  </div>
</div></div>
<div class="wrap">

<!-- LOCK -->
<div class="screen on" id="s0">
  <div style="font-size:34px">🔒</div>
  <h1>اكتبي الرقم السري</h1>
  <p class="sub">رقم بس إحنا منعرفه ♡</p>
  <div class="pin" id="pin">
    <input inputmode="numeric" maxlength="1" pattern="[0-9]">
    <input inputmode="numeric" maxlength="1" pattern="[0-9]">
    <input inputmode="numeric" maxlength="1" pattern="[0-9]">
    <input inputmode="numeric" maxlength="1" pattern="[0-9]">
  </div>
  <div class="card" id="kcard">
    <div id="kitty"></div>
    <div id="kmsg" style="font-weight:700;margin-top:6px">ادخلي الرقم 🎀</div>
  </div>
  <button class="btn" id="unlock">فتح ♡</button>
</div>

<!-- 1 GIFT -->
<div class="screen" id="s1">
  <div class="dots">١ / ٣</div>
  <h1>🎁 هديتك</h1>
  <p class="sub">اختاري هديتك</p>
  <button class="opt" data-k="gift" data-v="بوكس هيلو كيتي 🎀">بوكس هيلو كيتي 🎀</button>
  <button class="opt" data-k="gift" data-v="حلويات 🍰">حلويات 🍰</button>
  <button class="opt" data-k="gift" data-v="أكل آسيوي 🍜">أكل آسيوي 🍜</button>
</div>

<!-- 2 PLACE -->
<div class="screen" id="s2">
  <div class="dots">٢ / ٣</div>
  <h1>📍 مكان الموعد</h1>
  <p class="sub">وين نروح؟</p>
  <button class="opt" data-k="place" data-v="ميغوستو">ميغوستو</button>
  <button class="opt" data-k="place" data-v="بنوراميك">بنوراميك</button>
  <button class="opt" data-k="place" data-v="مفاجأة 🎁">مفاجأة 🎁</button>
</div>

<!-- 3 DATE (written) -->
<div class="screen" id="s3">
  <div class="dots">٣ / ٣</div>
  <h1>📅 تاريخ الموعد</h1>
  <p class="sub">اكتبي التاريخ اللي يناسبك</p>
  <input class="txt" id="dt" placeholder="مثال: الخميس ١٢ / ١٢">
  <textarea id="note" placeholder="كلمة سرّية إلي… (اختياري) 💌"></textarea>
  <button class="btn" id="done">تمّ ♡</button>
</div>

<!-- FINAL SECRET -->
<div class="screen" id="s4">
  <div id="kitty2"></div>
  <h1>سرّنا 🤫💗</h1>
  <div class="card sum" id="sum"></div>
  <button class="btn" id="send">إرسال ردّك 💌</button>
  <p class="sub" style="margin-top:14px" id="hint"></p>
</div>

</div>
<script>
const CODE="1612",ans={};
const kit=(cry)=>`<svg width="110" height="100" viewBox="0 0 110 100"><polygon points="20,38 18,6 46,20" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/><polygon points="90,38 92,6 64,20" fill="#fff" stroke="#333" stroke-width="3" stroke-linejoin="round"/><ellipse cx="55" cy="56" rx="42" ry="34" fill="#fff" stroke="#333" stroke-width="3"/><circle cx="36" cy="56" r="3.5" fill="#222"/><circle cx="74" cy="56" r="3.5" fill="#222"/><ellipse cx="55" cy="64" rx="5" ry="3.5" fill="#f6c21c" stroke="#333" stroke-width="1.5"/><g stroke="#333" stroke-width="2" stroke-linecap="round"><line x1="6" y1="54" x2="24" y2="58"/><line x1="6" y1="66" x2="24" y2="63"/><line x1="104" y1="54" x2="86" y2="58"/><line x1="104" y1="66" x2="86" y2="63"/></g><g fill="#e0245e" stroke="#333" stroke-width="2"><ellipse cx="78" cy="26" rx="10" ry="8"/><ellipse cx="96" cy="22" rx="8" ry="8"/><circle cx="88" cy="25" r="5"/></g>${cry?'<path d="M34 62 q-3 12 0 16 q4-4 0-16z M76 62 q-3 12 0 16 q4-4 0-16z" fill="#6ec3ff"/>':''}</svg>`;
kitty.innerHTML=kit(false);kitty2.innerHTML=kit(false);
const show=n=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById('s'+n).classList.add('on')};
const ins=[...document.querySelectorAll('#pin input')];
ins.forEach((el,i)=>{
  el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'');if(el.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))check()});
  el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus()});
});
function hearts(){for(let i=0;i<22;i++){const h=document.createElement('div');h.className='heart';h.textContent=['💗','🎀','💖'][i%3];h.style.left=Math.random()*100+'vw';h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),7000)}}
function check(){
  const v=ins.map(x=>x.value).join('');
  if(v===CODE){kmsg.textContent='صح! أهلاً فيكِ 💗';hearts();setTimeout(()=>show(1),900)}
  else{kitty.innerHTML=kit(true);kmsg.textContent='غلط يا قلبي! 🥺';kcard.classList.add('shake');setTimeout(()=>kcard.classList.remove('shake'),400);ins.forEach(x=>x.value='');ins[0].focus()}
}
unlock.onclick=()=>{ins.every(x=>x.value)?check():ins[ins.findIndex(x=>!x.value)].focus()};
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
  b.classList.add('sel');ans[b.dataset.k]=b.dataset.v;
  setTimeout(()=>show(b.dataset.k==='gift'?2:3),350);
});
done.onclick=()=>{
  if(!dt.value.trim()){dt.focus();return}
  ans.date=dt.value.trim();ans.note=note.value.trim();
  try{localStorage.setItem('res',JSON.stringify(ans))}catch(e){}
  sum.innerHTML=`🎁 الهدية: ${ans.gift}<br>📍 المكان: ${ans.place}<br>📅 التاريخ: ${ans.date}`+(ans.note?`<br>💌 ${ans.note.replace(/</g,'&lt;')}`:'');
  show(4);hearts();
};
send.onclick=async()=>{
  const t=`🎀 ردّي:\n🎁 الهدية: ${ans.gift}\n📍 المكان: ${ans.place}\n📅 التاريخ: ${ans.date}`+(ans.note?`\n💌 ${ans.note}`:'');
  try{if(navigator.share){await navigator.share({text:t});return}}catch(e){}
  try{await navigator.clipboard.writeText(t);hint.textContent='اننسخ الرد، ابعتيه إلي 💗'}catch(e){hint.textContent='انسخي الرد وابعتيه: '+t}
};
rb.onclick=()=>{ov.classList.add('on');rlock.style.display='block';rres.style.display='none';rc.value='';rerr.textContent=''};
xx.onclick=()=>ov.classList.remove('on');
rgo.onclick=()=>{
  if(rc.value.trim().toUpperCase()!=='AA12'){rerr.textContent='كود غلط 🥺';rlock.classList.add('shake');setTimeout(()=>rlock.classList.remove('shake'),400);return}
  let r=null;try{r=JSON.parse(localStorage.getItem('res')||'null')}catch(e){}
  rbody.innerHTML=r?`🎁 الهدية: ${r.gift||'-'}<br>📍 المكان: ${r.place||'-'}<br>📅 التاريخ: ${r.date||'-'}`+(r.note?`<br>💌 ${r.note.replace(/</g,'&lt;')}`:''):'ما في نتائج بعد 🎀';
  rlock.style.display='none';rres.style.display='block';
};
</script>
</body>
</html>
